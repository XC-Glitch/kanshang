<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看上 - 实用工具导航</title>
<style>
/* 原有样式完全保留，只加弹窗相关（如果有冲突会注释） */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Arial,sans-serif}
:root{--primary-color:#fff;--secondary-color:#87E8DE;--secondary-dark:#6BC9BE;--text-color:#333;--light-gray:#f5f5f5;--border-color:#e0e0e0}
body{background:var(--light-gray);color:var(--text-color);line-height:1.6}
.navbar{background:var(--primary-color);border-bottom:1px solid var(--secondary-color);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px rgba(0,0,0,.05);flex-wrap:wrap}
.logo{font-size:24px;font-weight:700;color:var(--secondary-color)}
.nav-links{display:flex;list-style:none;flex-wrap:wrap;gap:8px}
.nav-links li{margin-left:0}
.nav-links a{text-decoration:none;color:var(--text-color);font-size:16px;transition:color .3s;padding:4px 8px;display:block}
.nav-links a:hover{color:var(--secondary-dark)}
.hero{text-align:center;padding:60px 20px;background:linear-gradient(135deg,#fff 0%,#f0fffd 100%);border-bottom:1px solid var(--border-color)}
.hero h1{font-size:32px;margin-bottom:15px;color:#333}
.hero p{font-size:16px;color:#666;max-width:600px;margin:0 auto 22px}
.search-box{max-width:600px;margin:0 auto;display:flex;gap:8px}
.search-box input{flex:1;padding:14px 18px;border:1px solid var(--border-color);border-radius:10px;font-size:15px;outline:0}
.search-box input:focus{border-color:var(--secondary-color)}
.search-box button{padding:14px 22px;background:var(--secondary-color);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:15px}
.search-box button:hover{background:var(--secondary-dark)}
.rank-container{max-width:1200px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.tool-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1px solid var(--border-color);transition:transform .2s}
.tool-card:hover{transform:translateY(-3px)}
.tool-card h3{font-size:16px;margin-bottom:8px;color:#333}
.tool-card .desc{font-size:13px;color:#888;height:36px;overflow:hidden;margin-bottom:12px}
.tool-card .stats{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:12px}
.tool-card .go{display:inline-block;background:var(--secondary-color);color:#fff;font-size:13px;padding:6px 11px;border-radius:6px;text-decoration:none}
.tool-card .go:hover{background:var(--secondary-dark)}
/* 免责声明样式 */
/* 替换index.html里的disclaimer样式 */
.disclaimer{
  display: block !important; /* 强制显示，优先级最高 */
  max-width: 1200px;
  margin: 30px auto !important; /* 确保居中且不被遮挡 */
  padding: 15px 20px;
  background: #fff9c4;
  border-left: 4px solid #ffc107;
  border-radius: 6px;
  font-size: 13px;
  color: #666;
  line-height: 1.6;
  width: 90%; /* 适配手机等小屏 */
  z-index: 10; /* 高于背景，低于弹窗 */
  box-sizing: border-box;
}
footer{background:var(--secondary-color);color:#fff;text-align:center;padding:25px 0;margin-top:20px}
/* 弹窗样式已内置在toast.js中，这里不用加 */
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">看上</div>
  <ul class="nav-links">
    <li><a href="#" onclick="goType('工具')">工具</a></li>
    <li><a href="#" onclick="goType('AI工具')">AI工具</a></li>
    <li><a href="#" onclick="goType('影视')">影视</a></li>
    <li><a href="#" onclick="goType('动漫')">动漫</a></li>
    <li><a href="#" onclick="goType('音乐')">音乐</a></li>
    <li><a href="#" onclick="goType('游戏')">游戏</a></li>
    <li><a href="#" onclick="goType('学习')">学习</a></li>
    <li><a href="#" onclick="goType('生活')">生活</a></li>
    <li><a href="#" onclick="goType('资源')">资源</a></li>
  </ul>
</div>

<div class="hero">
  <h1>看上 - 实用工具导航</h1>
  <p>收集全网优质在线工具，按热度智能排序，发现最实用的工具</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索工具名称、功能、关键词...">
    <button onclick="goSearch()">搜索</button>
  </div>
</div>

<div class="rank-container" id="cardContainer"></div>

<!-- 免责声明 -->
<div class="disclaimer">
  <strong>免责声明：</strong>本站仅为工具导航服务，不制作、不存储任何工具内容，所有工具链接均来自互联网公开资源。
  用户使用第三方工具时产生的一切行为、版权、合规问题，均由用户自行承担。若有侵权，请联系站长删除相关链接。
</div>

<footer>
  <p>© 2026 看上 - 让生活更方便</p>
</footer>

<!-- 关键：先引入toast.js，再引入其他文件（顺序不能错） -->
<script src="toast.js"></script>
<script src="tool-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>

<script>
// ==================== 数据库部分 完全保留 ====================
const SUPABASE_URL = "https://yamonzbighacvvehwaad.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhbW9uemJpZ2hhY3Z2ZWh3YWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNTI1NTUsImV4cCI6MjA4NzgyODU1NX0.xo-gMJi_7q4Wb9vpjs-BD-5RsmAM_erIQrpoXbFwj1M"; // 替换成你的密钥
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const cardContainer = document.getElementById("cardContainer");
const searchInput = document.getElementById("searchInput");

// 仅弹窗免责声明，页面加载时弹一次
window.onload = function() {
  Toast.show(`
    免责声明：本站仅为工具导航服务，不制作、不存储任何工具内容，所有工具链接均来自互联网公开资源。
    用户使用第三方工具时产生的一切行为、版权、合规问题，均由用户自行承担。若有侵权，请联系站长删除相关链接。
  `, 'default');
};

 //页面加载完成就弹测试弹窗（验证弹窗是否生效）
// 页面加载完成后，弹出手动关闭的免责声明
window.onload = function() {
  Toast.showDisclaimer(); // 仅弹这个，删除所有其他弹窗代码
};

// 确保这部分代码完整存在于 index.html 的 <script> 中
async function loadData() {
  try {
    const { data, error } = await supabase
      .from('tool_stats')
      .select('id, like_count, view_count');
    if (error) throw error;
    if (data) {
      data.forEach(stat => {
        const tool = toolList.find(t => t.id === stat.id);
        if (tool) {
          tool.like = stat.like_count;
          tool.view = stat.view_count;
        }
      });
    }
  } catch (err) {
    console.warn("加载数据失败，使用本地默认值：", err);
  } finally {
    toolList.sort((a, b) => b.view - a.view);
    renderAll(); // 关键：无论是否加载成功，都渲染卡片
  }
}

function renderAll() {
  cardContainer.innerHTML = "";
  const fragment = document.createDocumentFragment();
  toolList.forEach(item => fragment.appendChild(createToolCard(item)));
  cardContainer.appendChild(fragment);
}

// 确保初始化调用未被删除
loadData();

 
function createToolCard(item) {
  const card = document.createElement("div");
  card.className = "tool-card";
  card.innerHTML = `
    <h3>${item.name}</h3>
    <div class="desc">${item.desc}</div>
    <div class="stats">
      <span class="view-count" data-id="${item.id}">👁️ ${item.view}</span>
      <span class="like-count" data-id="${item.id}" style="cursor:pointer">👍 ${item.like}</span>
    </div>
    <a href="${item.url}" target="_blank" class="go" data-id="${item.id}">前往</a>
  `;
  // 点赞弹窗
  card.querySelector(".like-count").addEventListener("click", () => {
    item.like++;
    card.querySelector(".like-count").textContent = `👍 ${item.like}`;
    syncToSupabase(item.id, 'like');
  });
  // 前往按钮弹窗
  card.querySelector(".go").addEventListener("click", () => {
    item.view++;
    card.querySelector(".view-count").textContent = `👁️ ${item.view}`;
    syncToSupabase(item.id, 'view');
    Toast.show(`正在前往「${item.name}」...`); // 普通提示
  });
  return card;
}

function renderAll() {
  cardContainer.innerHTML = "";
  const fragment = document.createDocumentFragment();
  toolList.forEach(item => fragment.appendChild(createToolCard(item)));
  cardContainer.appendChild(fragment);
}

// 搜索空内容弹窗
function goSearch() {
  const q = searchInput.value.trim();
  if (!q) { 
    Toast.error("请输入搜索关键词！"); // 搜索空内容弹窗
    return; 
  }
  location.href = `search.html?q=${encodeURIComponent(q)}`;
}

function goType(type) {
  location.href = `search.html?type=${encodeURIComponent(type)}`;
}

// 回车搜索
searchInput.addEventListener("keypress", e => {
  if (e.key === "Enter") goSearch();
});

// 初始化加载数据
loadData();
</script>
</body>
</html>
